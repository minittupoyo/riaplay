name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml から呼ぶ

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (deb / rpm / AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: システム依存パッケージ
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libdbus-1-dev libmpv-dev patchelf rpm xvfb

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun run build
      # テストは Tauri のウィンドウを作るので、仮想ディスプレイ上で動かす。
      # secrets_roundtrip は実際の OS キーチェーン（Secret Service）が要るので CI では除く
      - run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml -- --skip secrets_roundtrip

      - name: Tauri ビルド
        run: bun run tauri build
        env:
          NO_STRIP: "true" # linuxdeploy の strip が新しい ELF 形式で失敗することがあるため
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: riaplay-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (NSIS / MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: libmpv を取得
        run: powershell -File scripts/fetch-libmpv.ps1
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: bun run tauri build
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: riaplay-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos:
    name: macOS (コンパイル確認のみ)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install mpv
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun run build
      # libmpv の同梱設定が未対応（src-tauri/libs/README.md）なので、バンドルは作らずコンパイルが通ることだけ確認する
      - run: bun run tauri build --no-bundle
        env:
          # Homebrew の libmpv をリンカーが見つけられるようにする
          LIBRARY_PATH: /opt/homebrew/lib
